[package]
name = "rmrf-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "rmrf"
path = "src/main.rs"

[dependencies]
rmrf-core = { path = "../rmrf-core" }
rmrf-source = { path = "../rmrf-source" }
rmrf-store = { path = "../rmrf-store" }
rmrf-manifest = { path = "../rmrf-manifest" }
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
fastcdc = "3"
