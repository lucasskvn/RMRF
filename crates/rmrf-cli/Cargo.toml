[package]
name = "rmrf-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "rmrf"
path = "src/main.rs"

[dependencies]
rmrf-core = { path = "../rmrf-core" }
rmrf-source = { path = "../rmrf-source" }
rmrf-store = { path = "../rmrf-store" }
rmrf-manifest = { path = "../rmrf-manifest" }
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
fastcdc = "3"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rayon = "1"
age = "0.11"
nix = { version = "0.31", features = ["signal"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
predicates = "3"
